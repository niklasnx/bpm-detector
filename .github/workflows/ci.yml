name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev patchelf

      - uses: Swatinem/rust-cache@v2

      - name: Unit + integration tests
        working-directory: app
        run: cargo test --release

      - name: Build binary
        working-directory: app
        run: cargo build --release

      - name: Smoke test (binary starts, exits cleanly)
        if: runner.os != 'Windows'
        working-directory: app
        run: |
          ./target/release/bpmdetector --help 2>/dev/null || true
          test -x target/release/bpmdetector

  build-rpi:
    # Raspberry Pi (aarch64 Linux) — the QLC+ user's use case
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - name: Cross-build for aarch64 Linux
        working-directory: app
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-g++
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: bpmdetector-aarch64-linux
          path: app/target/aarch64-unknown-linux-gnu/release/bpmdetector
