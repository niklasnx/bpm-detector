name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev patchelf clang libclang-dev

      - name: Locate libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin") {
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Unit + integration tests
        working-directory: app
        run: cargo test --release

      - name: Clippy
        working-directory: app
        run: cargo clippy --all-targets -- -D warnings

      - name: Build binary
        working-directory: app
        run: cargo build --release

      - name: Smoke test (binary exists)
        if: runner.os != 'Windows'
        working-directory: app
        run: test -x target/release/bpmdetector

      - name: Smoke test (binary exists, Windows)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: if (-not (Test-Path target/release/bpmdetector.exe)) { exit 1 }

  build-rpi:
    # Native aarch64 Linux build (Raspberry Pi 4/5, 64-bit OS).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev patchelf clang libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Build for aarch64 Linux
        working-directory: app
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: bpmdetector-aarch64-linux
          path: app/target/release/bpmdetector
